<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MVP Broadcast Engine V3 Test</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#070a0f;color:#f7fbff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}
    main{width:min(940px,100%);background:#0d151e;border:1px solid #263849;border-radius:20px;padding:18px;box-shadow:0 24px 80px #0008}
    h1{margin:0;font-size:22px}.sub{margin:5px 0 16px;color:#8ea6b6;font-size:13px}
    .row{display:grid;gap:8px;margin:10px 0}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}
    button,.file{border:1px solid #31475a;background:#131f2a;color:#d9e7ee;border-radius:11px;padding:11px 9px;font-weight:800;cursor:pointer;text-align:center}
    button.active{border-color:#39d8ff;background:#103f52;color:#fff;box-shadow:0 0 18px #28c8f329}
    button.power.active{border-color:#ff9d35;background:#5b2c0c}
    audio{width:100%;margin:10px 0}.section{border-top:1px solid #ffffff12;padding-top:10px;margin-top:10px}
    .section>span{display:block;font-size:10px;font-weight:900;letter-spacing:.12em;color:#8da6b4;margin-bottom:7px}
    .range{display:grid;grid-template-columns:70px 1fr 52px;align-items:center;gap:10px;padding:9px 0}
    .range input{width:100%}.range b{text-align:right}.range small{color:#90a4b1}
    .meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:14px}
    .meter{background:#081019;border:1px solid #1d2b38;border-radius:11px;padding:10px}.meter span{display:block;color:#7d93a3;font-size:9px;text-transform:uppercase;letter-spacing:.08em}.meter b{display:block;margin-top:4px;font:700 16px ui-monospace,monospace}
    #log{white-space:pre-wrap;background:#070d13;border:1px solid #1c2b39;border-radius:11px;padding:10px;margin-top:12px;min-height:100px;color:#aec2cf;font:12px ui-monospace,monospace}
    @media(max-width:620px){.four{grid-template-columns:repeat(2,1fr)}button{font-size:12px}}
  </style>
</head>
<body>
<main>
  <h1>MVP Broadcast Engine V3</h1>
  <div class="sub">Isolated proof page. Same WASM core used by the production bridge.</div>
  <div class="row four">
    <label class="file">Choose Song <input id="file" type="file" accept="audio/*"/></label>
    <button id="init">INITIALIZE</button>
    <button id="proof">RUN PROOF</button>
    <button id="mute">PROOF MUTE</button>
  </div>
  <audio id="audio" controls preload="metadata"></audio>

  <div class="section"><span>OUTPUT</span>
    <div class="row three" id="profiles">
      <button data-profile="headphones" class="active">HEADPHONES</button>
      <button data-profile="speaker">BLUETOOTH</button>
      <button data-profile="car_hifi">CAR / HI-FI</button>
    </div>
  </div>

  <div class="section"><span>MODE</span>
    <div class="row three" id="modes">
      <button data-mode="pure">PURE</button>
      <button data-mode="adaptive" class="active">ADAPTIVE</button>
      <button data-mode="power" class="power">POWER</button>
    </div>
  </div>

  <div class="section"><span>SOUND</span>
    <div class="row four">
      <button data-effect="bassEnabled">BASS</button>
      <button data-effect="impactEnabled">IMPACT</button>
      <button data-effect="clarityEnabled">CLARITY</button>
      <button data-effect="spatialEnabled" id="spatialLabel">IMMERSION</button>
    </div>
    <label class="range"><small>Intensity</small><input id="intensity" type="range" min="0" max="100" value="72"/><b id="intensityValue">72%</b></label>
    <label class="range" id="bassCharacterRow" hidden><small>Tight</small><input id="bassCharacter" type="range" min="0" max="100" value="50"/><b>Deep</b></label>
    <div class="row three" id="spaceModes" hidden>
      <button data-space="studio" class="active">STUDIO</button>
      <button data-space="live">LIVE</button>
      <button data-space="arena">ARENA</button>
    </div>
  </div>

  <div class="meters">
    <div class="meter"><span>Out / In</span><b id="delta">--</b></div>
    <div class="meter"><span>True Peak</span><b id="tp">--</b></div>
    <div class="meter"><span>Limiter GR</span><b id="gr">--</b></div>
    <div class="meter"><span>Multiband GR</span><b id="mb">--</b></div>
    <div class="meter"><span>Impact</span><b id="impactMeter">--</b></div>
    <div class="meter"><span>Width</span><b id="width">--</b></div>
    <div class="meter"><span>Clips</span><b id="clips">0</b></div>
    <div class="meter"><span>NaN</span><b id="nans">0</b></div>
  </div>
  <div id="log">Choose a local song, then initialize.</div>
</main>
<script type="module" src="/audioV2/test.js?v=broadcast-v3"></script>
</body>
</html>
