name: MVP Audio Foundation R13.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/audio/mvpSoundModes-r13-1.worklet.js"
      - "src/lib/musicPlayer.ts"
      - "src/features/music/MusicMiniPlayer.tsx"
      - "scripts/test-audio-foundation-r13-1.mjs"
      - ".github/workflows/audio-foundation-r13-1.yml"

permissions:
  contents: read

jobs:
  validate-audio-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate R13.1 Worklet syntax
        run: node --check public/audio/mvpSoundModes-r13-1.worklet.js
      - name: Run strict R13.1 loudness validation
        run: node scripts/test-audio-foundation-r13-1.mjs
      - name: Run production app build
        run: npm run build
