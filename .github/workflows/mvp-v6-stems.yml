name: MVP Sound V6 Demucs Stems

on:
  workflow_dispatch:
    inputs:
      track_id:
        description: Track UUID
        required: true
        type: string
      storage_path:
        description: Private R2 object key
        required: true
        type: string
      job_id:
        description: Object Audio job UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mvp-v6-stems-${{ inputs.track_id }}
  cancel-in-progress: false

jobs:
  separate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TRACK_ID: ${{ inputs.track_id }}
      STORAGE_PATH: ${{ inputs.storage_path }}
      JOB_ID: ${{ inputs.job_id }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg, Demucs and R2 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "demucs==4.0.1" awscli

      - name: Validate R2 configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET_NAME"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          [[ "$STORAGE_PATH" == */* ]]
          [[ "$TRACK_ID" != "" ]]
          [[ "$JOB_ID" != "" ]]

      - name: Mark Object Audio processing
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${STORAGE_PATH%%/*}"
          STATUS_KEY="$OWNER/stems/$TRACK_ID/status.json"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"status":"processing","jobId":"%s","trackId":"%s","updatedAt":"%s"}\n' "$JOB_ID" "$TRACK_ID" "$NOW" > status.json
          aws s3 cp status.json "s3://$R2_BUCKET_NAME/$STATUS_KEY" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type application/json

      - name: Download original private track
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input separated
          ORIGINAL_NAME="$(basename "$STORAGE_PATH")"
          aws s3 cp "s3://$R2_BUCKET_NAME/$STORAGE_PATH" "input/$ORIGINAL_NAME" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"

      - name: Separate vocals drums bass and other
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_NAME="$(basename "$STORAGE_PATH")"
          python -m demucs \
            --name htdemucs \
            --shifts 1 \
            --overlap 0.25 \
            --mp3 \
            --mp3-bitrate 320 \
            --out separated \
            "input/$ORIGINAL_NAME"

          STEM_DIR="$(find separated/htdemucs -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -d "$STEM_DIR"
          for STEM in vocals drums bass other; do
            test -s "$STEM_DIR/$STEM.mp3"
          done
          printf '%s\n' "$STEM_DIR" > stem-dir.txt

      - name: Upload permanent stems to R2
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${STORAGE_PATH%%/*}"
          PREFIX="$OWNER/stems/$TRACK_ID"
          STEM_DIR="$(cat stem-dir.txt)"
          for STEM in vocals drums bass other; do
            aws s3 cp "$STEM_DIR/$STEM.mp3" "s3://$R2_BUCKET_NAME/$PREFIX/$STEM.mp3" \
              --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --content-type audio/mpeg
          done

      - name: Mark Object Audio ready
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${STORAGE_PATH%%/*}"
          STATUS_KEY="$OWNER/stems/$TRACK_ID/status.json"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"status":"ready","jobId":"%s","trackId":"%s","updatedAt":"%s"}\n' "$JOB_ID" "$TRACK_ID" "$NOW" > status.json
          aws s3 cp status.json "s3://$R2_BUCKET_NAME/$STATUS_KEY" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type application/json

      - name: Mark Object Audio failed
        if: failure()
        shell: bash
        run: |
          set +e
          if ! command -v aws >/dev/null 2>&1; then
            exit 0
          fi
          if [ -z "${STORAGE_PATH:-}" ] || [ -z "${TRACK_ID:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_BUCKET_NAME:-}" ]; then
            exit 0
          fi
          OWNER="${STORAGE_PATH%%/*}"
          STATUS_KEY="$OWNER/stems/$TRACK_ID/status.json"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"status":"failed","jobId":"%s","trackId":"%s","error":"GitHub Demucs job failed. Open the MVP Sound V6 Demucs Stems workflow log.","updatedAt":"%s"}\n' "$JOB_ID" "$TRACK_ID" "$NOW" > status.json
          aws s3 cp status.json "s3://$R2_BUCKET_NAME/$STATUS_KEY" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type application/json
