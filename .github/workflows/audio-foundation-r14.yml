name: MVP Audio Foundation R15

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/audio/mvpSoundModes-r15.worklet.js"
      - "src/lib/musicPlayer.ts"
      - "src/features/music/MusicMiniPlayer.tsx"
      - "scripts/test-audio-foundation-r15.mjs"
      - ".github/workflows/audio-foundation-r14.yml"

permissions:
  contents: read

jobs:
  validate-audio-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate R15 Worklet syntax
        run: node --check public/audio/mvpSoundModes-r15.worklet.js

      - name: Run R15 loudness and switching validation
        run: node scripts/test-audio-foundation-r15.mjs

      - name: Run production app build
        run: npm run build
